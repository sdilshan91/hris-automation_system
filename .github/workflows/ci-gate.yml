name: CI Gate

# Required-status-check gate for PRs into main.
# Runs the SAME verify gate the /implement-all loop runs locally:
#   backend  -> dotnet build + dotnet test
#   frontend -> npm run build + ng test     (Karma + headless Chrome)
# No Anthropic API / secrets required — this is free CI (GitHub Actions minutes only).
#
# NOTE: `dotnet test` runs the FULL suite unfiltered, which includes ~45 Testcontainers
# classes (real Docker PostgreSQL 17), among them the RLS isolation + reconciler suites.
# So this backend job HARD-REQUIRES Docker on the runner (fine on GitHub `ubuntu-latest`,
# where Testcontainers works out of the box). It is NOT "EF Core InMemory, no DB needed" —
# the RLS Testcontainers tests already run here, so no separate RLS service-container job
# is required (see Rls/README.md §3b).

on:
  pull_request:
    # `main` is stale; the de-facto trunk is `test/local-subdomains`. Triggering only on `main` meant this
    # gate had not run on a merged PR since 2026-07-01 — including every PR that added the RLS Testcontainers
    # suites the pre-flip checklist depends on. CI that never fires is worse than no CI: it reports a green
    # checkbox nobody earned.
    branches: [main, test/local-subdomains]
  workflow_dispatch:

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: ci-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Docs-only fast path ────────────────────────────────────────────────────────────────────────
  # A PR that only touches docs/**.md cannot break the build, but it CAN break the four tests that
  # READ markdown — LedgerTraceability (the ledger drift guard), AuthEmailLinkRoute and
  # PasswordHashingWorkFactor (both read CLAUDE.md), and LopAuthorityPayroll (reads a vault decision
  # note). So this is a NARROWED gate, never a skip.
  #
  # Deliberately implemented as job-level `if:` and NOT as `paths-ignore` on the workflow. A workflow
  # that does not fire never reports its checks, so a required check stays pending and the PR blocks
  # forever; a job skipped via `if:` still reports and satisfies branch protection. This is the same
  # trap the trigger comment above already warns about: "CI that never fires is worse than no CI."
  #
  # gitleaks and semgrep live in their own workflows with no path filters, so secret scanning still
  # runs on docs PRs — which matters, because a .md is a very plausible place to paste a connection
  # string.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Classify the diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull_request event — running the full gate."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          files=$(git diff --name-only "$base" "$head")
          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          if [ -z "$files" ]; then
            echo "Empty diff — running the full gate (fail safe)."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Anything outside docs/**.md forces the full gate. Note CLAUDE.md is at the repo ROOT and is
          # therefore NOT docs-only — correct, since two tests read it.
          #
          # Written as "capture the non-matching lines, test for non-empty" rather than the shorter
          # `grep -qvE`. That shorter form is NOT portable: GNU grep (what runners use) exits 0 here,
          # but ugrep — the grep on at least one dev machine in this project — exits 1 for the same
          # input, which would silently invert this decision and skip the full gate on a code change.
          # This form behaves identically on both and can be tested locally.
          nondocs=$(printf '%s\n' "$files" | grep -vE '^docs/.+\.md$' || true)
          if [ -n "$nondocs" ]; then
            echo "Non-docs paths present — running the full gate:"
            printf '%s\n' "$nondocs" | sed 's/^/  /'
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs/**.md only — running the narrowed docs gate."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  docs-gate:
    name: Docs gate (the tests that read markdown)
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test — every suite that reads a markdown file
        # Keep this filter in sync with: grep -rln 'docs/\|\.md"' src/backend/HRM.Tests/
        # LedgerTraceability is the load-bearing one: it parses STATUS.md, TEST-STATUS.md and
        # TEST-FINDINGS.md, and it is the guard the whole gap-closure programme relies on. If a docs
        # PR could skip it, the drift guard would stop running on exactly the commits that edit the
        # ledgers.
        run: |
          dotnet test src/backend/HRM.sln --nologo \
            --filter "FullyQualifiedName~LedgerTraceability|FullyQualifiedName~AuthEmailLinkRoute|FullyQualifiedName~PasswordHashingWorkFactor|FullyQualifiedName~LopAuthorityPayroll"

  backend:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/backend/HRM.sln

      - name: Build
        run: dotnet build src/backend/HRM.sln --no-restore -c Release

      - name: Contract (OpenAPI) is up to date
        # GAP-S1: the committed contracts/openapi/hrm-v1.json must still describe the built assembly.
        # This is what turns a C# DTO/route change into a BUILD FAILURE at the point of change, instead
        # of a runtime 400 discovered months later in a module nobody was looking at (the drift that hit
        # 9 of 13 modules). CONFIGURATION=Release reuses the assembly the Build step just produced.
        env:
          CONFIGURATION: Release
        run: bash scripts/gen-openapi.sh --check

      - name: Test
        # ISSUE-312: wrap `dotnet test` so an ABORTED run (test-host crash) FAILS the gate
        # instead of exiting 0 with a partial `Passed!` line that hides the tests that never ran.
        # GAP-031: COVERAGE=1 turns on coverlet, which is referenced by HRM.Tests but had never been
        # invoked — so §6.6's >=70%/>=85% target could be neither met nor missed. Measure-only for now;
        # no threshold is enforced until the real figure has been seen at least once.
        env:
          COVERAGE: '1'
        run: bash scripts/run-backend-tests.sh src/backend/HRM.sln --no-build -c Release --logger "trx;LogFileName=backend-tests.trx"

      - name: Report backend line coverage
        if: always()
        run: |
          report=$(find . -name 'coverage.cobertura.xml' | head -1)
          if [ -z "$report" ]; then
            echo "No coverage report produced -- check that COVERAGE=1 reached the test step."
            exit 0
          fi
          python3 -c "import sys,xml.etree.ElementTree as ET; r=ET.parse(sys.argv[1]).getroot(); print(f\"Backend coverage: lines {float(r.get('line-rate',0))*100:.1f}% branches {float(r.get('branch-rate',0))*100:.1f}%\")" "$report" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: '**/backend-tests.trx'
          if-no-files-found: ignore

  migrations:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Migrations (real PostgreSQL apply)
    # Applies the EF Core migration chain to a real PostgreSQL service container
    # and asserts the expected schema exists. This catches non-discoverable /
    # hand-written migrations that the InMemory-based unit tests cannot see
    # (a migration with no [Migration] attribute is silently skipped by
    # Database.MigrateAsync — see fix/employee-migrations-discoverable).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
          POSTGRES_DB: hrm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrm -d hrm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Overrides ConnectionStrings:DefaultConnection from appsettings.json.
      # Jwt:PrivateKey is intentionally left blank (as in appsettings.json) — Program.cs
      # skips PEM parsing when it is empty; a non-empty invalid value would throw at
      # host build and break the design-time DbContext creation.
      ConnectionStrings__DefaultConnection: 'Host=localhost;Port=5432;Database=hrm_ci;Username=hrm;Password=hrm'
      Encryption__ActiveKeyId: hrm-field-key-1
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.*

      - name: Restore
        run: dotnet restore src/backend/HRM.sln

      - name: Apply migrations to PostgreSQL
        # GAP-036: `dotnet ef` builds the REAL host, and AppDbContext's value converters resolve
        # IFieldEncryptor — which FAIL-FASTS with no key. This step used to work only because a live key was
        # committed in appsettings.Development.json (EF tools default to the Development environment).
        # Verified by removing it: "Unable to create a 'DbContext' … Field encryption is not configured".
        #
        # Passed inline via `env` rather than exported: the key id contains hyphens, which bash's `export`
        # rejects as an identifier. `env` accepts it and .NET reads it from the process environment — both
        # halves verified locally before this was written.
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          env "Encryption__Keys__hrm-field-key-1=$(openssl rand -base64 32)" \
            dotnet ef database update \
              --project src/backend/HRM.Infrastructure \
              --startup-project src/backend/HRM.Api

      - name: Assert expected schema exists
        run: |
          # No apt install. The postgres SERVICE CONTAINER already ships psql, so we exec into it
          # instead of fetching a client onto the runner.
          #
          # This step used to begin `sudo apt-get update -qq && apt-get install -y -qq postgresql-client`.
          # On 2026-08-19 that apt call stalled, and because -qq suppresses output it produced ZERO log
          # lines while holding the job open until GitHub's 6-hour ceiling killed it (08:25:40 -> 14:26:48).
          # A frontend-only PR sat blocked for six hours on a package fetch it never needed. Removing the
          # network dependency is strictly better than timing it out: there is now nothing to stall.
          PG=$(docker ps --filter "ancestor=postgres:16" --format '{{.ID}}' | head -1)
          if [ -z "$PG" ]; then
            echo "::error::postgres service container not found — cannot assert schema"
            exit 1
          fi
          PSQL="docker exec -i -e PGPASSWORD=hrm $PG psql -U hrm -d hrm_ci -tAc"
          fail=0
          for t in employees emergency_contacts employment_histories employee_field_audit_logs; do
            exists=$($PSQL "SELECT to_regclass('public.$t') IS NOT NULL")
            echo "table $t -> $exists"
            [ "$exists" = "t" ] || { echo "::error::expected table '$t' was not created by migrations"; fail=1; }
          done
          for c in lockout_count last_lockout_at mfa_failed_attempt_count; do
            exists=$($PSQL "SELECT EXISTS(SELECT 1 FROM information_schema.columns WHERE table_name='users' AND column_name='$c')")
            echo "users.$c -> $exists"
            [ "$exists" = "t" ] || { echo "::error::expected column users.$c was not created by migrations"; fail=1; }
          done
          exit $fail

  frontend:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Frontend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: API models match the contract
        # GAP-S1, frontend half: regenerate the TypeScript models from the committed OpenAPI document and
        # fail if anything changed. Together with the backend's "Contract is up to date" step this closes
        # the loop — C# DTO -> contract -> TS models — so the Angular layer can no longer be coded against
        # a shape the API cannot emit. Runs before Build so the failure names the cause directly.
        run: npm run api:types:check

      - name: Build
        run: npm run build

      - name: Test (headless Chrome)
        # GitHub-hosted ubuntu-latest is a non-root VM with google-chrome
        # preinstalled, so ChromeHeadless works without --no-sandbox.
        # If a Chrome sandbox error ever appears, add a karma.conf.js with a
        # ChromeHeadlessNoSandbox launcher and switch --browsers to it.
        # GAP-031: --code-coverage turns on the karma-coverage reporter, which ships in devDependencies
        # but was never switched on. Measure-only, same rationale as the backend.
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

  e2e:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: E2E (Playwright — real browser → Angular → API → Postgres)
    # GAP-034. The suite existed but nothing ran it, and "just add a Playwright step" was wrong twice:
    #
    #   1. It needs a frontend origin that PROXIES /api to the backend. `ng serve` does (proxy.conf.json);
    #      the Docker `frontend` container does NOT — its nginx serves static files only, so GETs return
    #      index.html with 200 and POST /auth/login returns 405, and all 30 tests die at login (ISSUE-365).
    #      That is why this job runs `npm start`, not the container image.
    #   2. It needs the whole stack: Postgres + backend + that proxying frontend. A bare `npx playwright
    #      test` step would have tested nothing.
    #
    # ASPNETCORE_ENVIRONMENT=Development is LOAD-BEARING: DbInitializer only seeds the `e2e` tenant and
    # owner@e2e.test outside production, and every spec authenticates as that user.
    #
    # No JWT secret is needed or wanted: JwtService generates an ephemeral RSA key pair at startup when
    # Jwt:PrivateKey is blank (JwtService.cs:40-44), so CI signs with a throwaway key and there is no
    # credential to store, rotate, or leak.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hrm
          POSTGRES_PASSWORD: hrm
          POSTGRES_DB: hrm_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrm -d hrm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5000
      ConnectionStrings__DefaultConnection: 'Host=localhost;Port=5432;Database=hrm_e2e;Username=hrm;Password=hrm'
      # The Hangfire SERVER (polling worker loop) only adds noise and races here; storage/client stay
      # registered so anything that enqueues still works. Same flag the integration host uses.
      Hangfire__DisableServer: 'true'
      # The suite authenticates ~30 times (once per test) against one origin, which trips the auth-login
      # policy of 10/min per IP. The FIRST CI run proved it: 28 logins returned 200 and 4 returned 429, and
      # those 429s — not the application — are what failed the run. Disabling here is not weakening a control:
      # the limiter is exercised directly and exhaustively by GlobalRateLimitPartitionTests (13 arms,
      # mutation-verified), and the same flag is what the HTTP integration host uses for the same reason. What
      # this job exists to test is the application behind the limiter.
      RateLimiting__Disabled: 'true'
      # GAP-036: the dev field-encryption key no longer ships in appsettings.Development.json, and
      # AesGcmFieldEncryptor FAIL-FASTS when no usable key is configured — so without this the app would not
      # boot here at all. Generated per run: CI encrypts nothing anyone will ever decrypt again, so a
      # throwaway key is strictly better than a shared one, and there is no secret to store or rotate.
      Encryption__ActiveKeyId: hrm-field-key-1
      E2E_BASE_URL: http://localhost:4200
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: src/frontend
        run: npm ci

      - name: Install Playwright chromium
        working-directory: src/frontend
        # Chromium only. Cross-browser (firefox/webkit) triples the run for engines that have never been
        # exercised in CI; adding them is a separate, deliberate step rather than a silent tripling here.
        run: npx playwright install --with-deps chromium

      - name: Build backend
        run: dotnet build src/backend/HRM.sln --configuration Release

      - name: Start backend
        # Migrations + the dev seed run on startup (DbInitializer), so this also proves the migration chain
        # applies to a clean database and the seed produces a usable tenant.
        run: |
          nohup env "Encryption__Keys__hrm-field-key-1=$(openssl rand -base64 32)" \
            dotnet run --project src/backend/HRM.Api --configuration Release --no-build \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "waiting for the API to become ready..."
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5000/health/ready > /dev/null 2>&1; then
              echo "backend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not become ready within 90s"
          tail -100 "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Start frontend (ng serve — proxies /api to the backend)
        working-directory: src/frontend
        run: |
          nohup npm start > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo "waiting for the dev server..."
          for i in $(seq 1 180); do
            if curl -fsS http://localhost:4200 > /dev/null 2>&1; then
              echo "frontend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::ng serve did not become ready within 180s"
          tail -100 "$RUNNER_TEMP/frontend.log"
          exit 1

      - name: Verify the proxy actually proxies
        # Guards ISSUE-365 directly. Without this, a non-proxying origin fails 30 tests with 30s login
        # timeouts and a log that says nothing about the cause — the exact dead end this job was written
        # after. A 4xx here is FINE (the endpoint rejects a bad body); HTML back means /api fell through
        # to index.html and the stack is misconfigured.
        run: |
          body=$(curl -s -o - -w '\n%{http_code}' -X POST http://localhost:4200/api/v1/auth/login \
            -H 'Content-Type: application/json' -d '{}' || true)
          echo "$body"
          case "$body" in
            *"<!doctype html>"*|*"<!DOCTYPE html>"*)
              echo "::error::/api returned HTML — ng serve is not proxying to the backend (ISSUE-365)"
              exit 1;;
          esac

      - name: Run E2E
        working-directory: src/frontend
        # github reporter for inline PR annotations, html so the uploaded artifact actually exists — the
        # first CI run uploaded nothing because 'github' alone writes no report directory, which is exactly
        # when you most want one.
        run: npx playwright test --project=chromium --reporter=github,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload server logs
        # BUG-302b's lesson: a caught-and-logged failure is invisible to a green suite. When an E2E run
        # fails, the backend log is usually where the real cause is.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/frontend.log
          if-no-files-found: ignore
