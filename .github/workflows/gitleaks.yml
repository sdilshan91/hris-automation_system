name: gitleaks

# Secret scanning — BLOCKING (GAP-031b, 2026-08-10). Complements the secret-guard
# PreToolUse hook: that stops a secret being WRITTEN by an agent, this stops one
# being MERGED by anyone.
#
# It was advisory pending a clean history. The history is clean: a full scan of
# 1170 commits returns zero findings once the three documentation placeholders in
# .gitleaks.toml are allow-listed. Advisory-plus-clean is the worst combination —
# it pays the whole runtime cost and catches nothing — so it now fails the build.
#
# If this job ever goes red: read the SARIF artifact. Do NOT reach for
# continue-on-error; either the finding is real, or it belongs in the .gitleaks.toml
# allowlist with a comment saying why it is not a secret.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the scan sees pre-hook commits

      - name: Run gitleaks
        id: gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --no-banner -v

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
