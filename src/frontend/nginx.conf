server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── §23.4 security headers ───────────────────────────────────────────────────────────────────
    # This file is the config baked into the served image (Dockerfile:21), and until now it set only
    # Cache-Control -- ZERO of the six headers §23.4 requires existed anywhere in the repo, and neither
    # did UseHsts/UseHttpsRedirection. GAP-033a.
    #
    # `always` matters: without it nginx omits the header on error responses (4xx/5xx), which is exactly
    # where clickjacking and sniffing protections are still needed.
    #
    # NOTE ON TLS: HSTS is emitted here, but production TLS terminates at an out-of-repo reverse proxy
    # (tech doc §7.4, §42.2). If that proxy also sets these headers, remove them here rather than sending
    # duplicates -- browsers take the first Strict-Transport-Security and ignore the rest, so two sources
    # is a silent-divergence risk. The go-live checklist now carries this as an explicit step.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP is report-only FIRST, deliberately.
    # Angular Material injects runtime <style> elements, so a strict style-src WILL block them. Shipping
    # an enforcing policy blind is how a CSP takes down a working UI; shipping report-only first surfaces
    # the real violations without breaking anyone. Promote to Content-Security-Policy once the reports are
    # clean -- tracked as the second half of GAP-033a.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA: route all unknown paths back to index.html so Angular's router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; never cache index.html.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        # NGINX INHERITANCE TRAP -- these six are NOT redundant, they are REQUIRED.
        # add_header is inherited from the enclosing level ONLY IF the current level declares no
        # add_header of its own. The Cache-Control line above is such a declaration, so without the
        # repetition below nginx silently drops ALL six server-level security headers for every .js,
        # .css, .woff2, and image -- i.e. exactly the static assets where nosniff matters MOST, since
        # MIME-sniffing a served file is the attack nosniff exists to stop.
        # If you edit the server-level block above, edit this one too. There is no inherit directive.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
