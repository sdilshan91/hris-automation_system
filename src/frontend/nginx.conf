server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── §23.4 security headers ───────────────────────────────────────────────────────────────────
    # This file is the config baked into the served image (Dockerfile:21), and until now it set only
    # Cache-Control -- ZERO of the six headers §23.4 requires existed anywhere in the repo, and neither
    # did UseHsts/UseHttpsRedirection. GAP-033a.
    #
    # `always` matters: without it nginx omits the header on error responses (4xx/5xx), which is exactly
    # where clickjacking and sniffing protections are still needed.
    #
    # NOTE ON TLS: HSTS is emitted here, but production TLS terminates at an out-of-repo reverse proxy
    # (tech doc §7.4, §42.2). If that proxy also sets these headers, remove them here rather than sending
    # duplicates -- browsers take the first Strict-Transport-Security and ignore the rest, so two sources
    # is a silent-divergence risk. The go-live checklist now carries this as an explicit step.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP is report-only FIRST, deliberately.
    # Angular Material injects runtime <style> elements, so a strict style-src WILL block them. Shipping
    # an enforcing policy blind is how a CSP takes down a working UI; shipping report-only first surfaces
    # the real violations without breaking anyone. Promote to Content-Security-Policy once the reports are
    # clean -- tracked as the second half of GAP-033a.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── ISSUE-365 / queue item E4: the /api + /hubs proxy ────────────────────────────────────────
    # Without these blocks, `docker compose up` publishes a login page that CANNOT log in. The SPA
    # built with the default `development` configuration sets `apiBaseUrl: '/api/v1'` (relative), so
    # the browser issues /api/v1/... to THIS server. With no /api location the request fell through
    # to `location /`'s try_files and returned **HTTP 200 with an HTML body** — a silent failure that
    # surfaces as an unexplained JSON parse error, not a 404.
    #
    # This is not a workaround bolted onto an absolute-URL design; it is the missing half of a
    # same-origin one. The `connect-src 'self'` in the CSP above would BLOCK a cross-origin call to
    # http://localhost:5000 outright, and notification.service.ts derives its SignalR hub URL from
    # apiBaseUrl, landing on a relative /hubs/notifications. Both assume this proxy exists.
    #
    # PRODUCTION SAFETY: a production build uses environment.prod.ts, whose apiBaseUrl is the ABSOLUTE
    # https://api.yourhrm.com/api/v1. A prod bundle therefore never issues a relative /api request and
    # never reaches these blocks — they are inert in a prod image rather than a hazard in one.
    #
    # The upstream goes through a VARIABLE deliberately. With a literal `proxy_pass http://backend:5000`
    # nginx resolves the hostname at STARTUP and refuses to boot where no host named `backend` exists —
    # which would turn a dev convenience into a container that will not start outside compose. Via a
    # variable + resolver, resolution happens per request: it proxies under compose, and returns 502 on
    # /api elsewhere instead of taking the whole server down.
    resolver 127.0.0.11 valid=30s ipv6=off;   # Docker's embedded DNS
    set $hrm_api http://backend:5000;

    location /api/ {
        proxy_pass $hrm_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Host is forwarded unchanged because tenant resolution is BY SUBDOMAIN
        # (TenantResolutionMiddleware). Rewriting it to the upstream name would resolve every
        # request to the wrong tenant — or to none — which is a tenant-isolation failure, not a
        # cosmetic header issue.
    }

    location /hubs/ {
        proxy_pass $hrm_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;   # SignalR connections are long-lived; the 60s default kills them
    }

    # SPA: route all unknown paths back to index.html so Angular's router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; never cache index.html.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;

        # NGINX INHERITANCE TRAP -- these six are NOT redundant, they are REQUIRED.
        # add_header is inherited from the enclosing level ONLY IF the current level declares no
        # add_header of its own. The Cache-Control line above is such a declaration, so without the
        # repetition below nginx silently drops ALL six server-level security headers for every .js,
        # .css, .woff2, and image -- i.e. exactly the static assets where nosniff matters MOST, since
        # MIME-sniffing a served file is the attack nosniff exists to stop.
        # If you edit the server-level block above, edit this one too. There is no inherit directive.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
