<div
  @backdrop
  class="fixed inset-0 z-[60] flex items-center justify-center bg-neutral-900/40 p-4"
  (click)="cancel()"
>
  <div
    @pop
    class="w-full max-w-lg rounded-xl bg-white p-6 shadow-xl"
    role="dialog"
    aria-modal="true"
    aria-labelledby="suspend-title"
    (click)="$event.stopPropagation()"
    appTrappedDialog
    (dismiss)="cancel()"
    data-testid="suspend-dialog"
  >
    <div class="flex items-start gap-3">
      <span
        class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-lg bg-red-100 text-red-700"
        aria-hidden="true"
      >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-5 w-5">
          <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
        </svg>
      </span>
      <div class="min-w-0">
        <h2 id="suspend-title" class="text-base font-semibold text-neutral-900">
          {{ 'LIFECYCLE.SUSPEND.TITLE' | translate }}
        </h2>
        <p class="mt-1 text-sm text-neutral-500">
          {{ 'LIFECYCLE.SUSPEND.SUBTITLE' | translate: { name: tenantName() } }}
        </p>
      </div>
    </div>

    <!-- Warning banner -->
    <div class="mt-5 rounded-lg bg-red-50 px-4 py-3" data-testid="suspend-warning">
      <p class="text-sm font-medium text-red-700">
        {{ 'LIFECYCLE.SUSPEND.WARNING' | translate }}
      </p>
    </div>

    <div class="mt-5 space-y-4">
      <!-- Reason -->
      <div>
        <div class="mb-1 flex items-center justify-between">
          <label for="suspend-reason" class="block text-sm font-medium text-neutral-700">
            {{ 'LIFECYCLE.REASON_LABEL' | translate }} <span class="text-red-500">*</span>
          </label>
          <span
            class="text-xs"
            [class.text-neutral-400]="reasonValid()"
            [class.text-red-500]="!reasonValid()"
            data-testid="reason-counter"
          >
            {{ reasonLength() }} / {{ REASON_MAX }}
          </span>
        </div>
        <textarea
          id="suspend-reason"
          rows="3"
          class="field resize-none"
          [attr.maxlength]="REASON_MAX"
          [attr.aria-invalid]="!reasonValid()"
          [placeholder]="'LIFECYCLE.REASON_PLACEHOLDER' | translate"
          [(ngModel)]="reason"
          (ngModelChange)="onInput()"
          data-testid="reason-input"
        ></textarea>
      </div>

      <!-- Step 2: acknowledgement -->
      <label class="flex items-start gap-2.5 cursor-pointer select-none">
        <input
          type="checkbox"
          class="mt-0.5 h-4 w-4 rounded border-neutral-300 text-red-600 focus:ring-red-500"
          [(ngModel)]="acknowledged"
          (ngModelChange)="onInput()"
          data-testid="ack-checkbox"
        />
        <span class="text-sm text-neutral-600">
          {{ 'LIFECYCLE.SUSPEND.ACK' | translate }}
        </span>
      </label>

      @if (submitError()) {
        <p class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert" data-testid="submit-error">
          {{ submitError() }}
        </p>
      }
    </div>

    <div class="mt-6 flex justify-end gap-2">
      <button
        type="button"
        class="rounded-lg px-4 py-2 text-sm font-medium text-neutral-600 transition hover:bg-neutral-100"
        (click)="cancel()"
        data-testid="cancel-btn"
      >
        {{ 'COMMON.CANCEL' | translate }}
      </button>
      <button
        type="button"
        class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="!canSubmit()"
        (click)="confirm()"
        data-testid="confirm-btn"
      >
        @if (submitting()) {
          {{ 'LIFECYCLE.SUSPEND.SUBMITTING' | translate }}
        } @else {
          {{ 'LIFECYCLE.SUSPEND.SUBMIT' | translate }}
        }
      </button>
    </div>
  </div>
</div>
