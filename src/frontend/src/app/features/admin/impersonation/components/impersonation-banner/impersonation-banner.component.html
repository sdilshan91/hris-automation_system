@if (isImpersonating()) {
  <div
    class="fixed inset-x-0 top-0 z-[100] flex items-center justify-center gap-3 bg-amber-500 px-4 py-2 text-sm font-medium text-amber-950 shadow-md"
    role="alert"
    aria-live="polite"
    data-testid="impersonation-banner"
  >
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="h-4 w-4 flex-shrink-0" aria-hidden="true">
      <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z" clip-rule="evenodd" />
    </svg>

    <span class="text-center" data-testid="banner-text">
      {{ 'IMPERSONATION.BANNER.LABEL' | translate }}
      <span class="font-mono">{{ 'IMPERSONATION.BANNER.REF' | translate: { ref: sessionId() } }}</span>
      @if (readOnly()) {
        <span class="ml-1 rounded bg-amber-700/30 px-1.5 py-0.5 text-xs font-semibold uppercase tracking-wide" data-testid="banner-readonly">
          {{ 'IMPERSONATION.BANNER.READ_ONLY' | translate }}
        </span>
      }
    </span>

    <button
      type="button"
      class="ml-2 flex-shrink-0 rounded-md bg-amber-950/10 px-3 py-1 text-xs font-semibold text-amber-950 transition hover:bg-amber-950/20 disabled:cursor-not-allowed disabled:opacity-60"
      [disabled]="ending()"
      (click)="endSession()"
      data-testid="end-session-btn"
    >
      @if (ending()) {
        {{ 'IMPERSONATION.BANNER.ENDING' | translate }}
      } @else {
        {{ 'IMPERSONATION.BANNER.END' | translate }}
      }
    </button>
  </div>
}
