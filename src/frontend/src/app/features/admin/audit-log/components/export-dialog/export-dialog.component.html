<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="audit-export-title"
  appTrappedDialog
  (dismiss)="cancel()"
>
  <!-- Backdrop -->
  <div
    class="absolute inset-0 bg-neutral-900/40 backdrop-blur-sm"
    (click)="cancel()"
    aria-hidden="true"
  ></div>

  <!-- Panel -->
  <div
    @dialogPop
    class="relative w-full max-w-md rounded-xl bg-white p-6 shadow-xl ring-1 ring-neutral-200"
  >
    <h2
      id="audit-export-title"
      class="text-lg font-semibold text-neutral-900"
    >
      {{ 'audit.export.title' | translate }}
    </h2>
    <p class="mt-1 text-sm text-neutral-500">
      {{ 'audit.export.subtitle' | translate: { count: recordCount() } }}
    </p>

    <!-- Format selection -->
    <fieldset class="mt-5">
      <legend class="text-xs font-medium uppercase tracking-wide text-neutral-400">
        {{ 'audit.export.format' | translate }}
      </legend>
      <div class="mt-2 grid grid-cols-2 gap-3">
        @for (opt of ['csv', 'json']; track opt) {
          <button
            type="button"
            (click)="selectFormat($any(opt))"
            [attr.aria-pressed]="format() === opt"
            class="rounded-lg border px-4 py-3 text-sm font-medium transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
            [class.border-indigo-500]="format() === opt"
            [class.bg-indigo-50]="format() === opt"
            [class.text-indigo-700]="format() === opt"
            [class.border-neutral-200]="format() !== opt"
            [class.text-neutral-600]="format() !== opt"
            [class.hover:bg-neutral-50]="format() !== opt"
          >
            {{ opt | uppercase }}
          </button>
        }
      </div>
    </fieldset>

    <!-- Actions -->
    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        (click)="cancel()"
        [disabled]="busy()"
        class="rounded-lg px-4 py-2 text-sm font-medium text-neutral-600 transition-colors hover:bg-neutral-100 disabled:opacity-40"
      >
        {{ 'common.cancel' | translate }}
      </button>
      <button
        type="button"
        (click)="confirm()"
        [disabled]="busy()"
        class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-indigo-700 disabled:opacity-50"
      >
        @if (busy()) {
          <span
            class="h-4 w-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
            aria-hidden="true"
          ></span>
        }
        {{ 'audit.export.confirm' | translate }}
      </button>
    </div>
  </div>
</div>
