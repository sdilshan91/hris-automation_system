# Local TLS reverse proxy for subdomain multi-tenancy testing (prod-shape rehearsal).
# Browse https://acme.myhrm.org (no port) — nginx terminates TLS and routes:
#   /api, /hangfire, /hubs  -> backend  (127.0.0.1:5000)
#   everything else         -> ng serve (127.0.0.1:4200)
# Run from repo root:
#   local-dev/nginx/nginx.exe -p "<repo>/local-dev/nginx/" -c "<repo>/local-dev/nginx.dev.conf"
# Reload: nginx.exe ... -s reload   |   Stop: nginx.exe ... -s stop

worker_processes 1;
events { worker_connections 1024; }

http {
    # WebSocket upgrade passthrough (ng live-reload + SignalR hubs).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Plain HTTP -> HTTPS redirect.
    server {
        listen 80;
        server_name myhrm.org *.myhrm.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name myhrm.org *.myhrm.org;

        ssl_certificate     d:/WORK/hris-automation_system/local-dev/certs/myhrm.fullchain.crt;
        ssl_certificate_key d:/WORK/hris-automation_system/local-dev/certs/myhrm.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # --- API -> backend. Host is preserved so the backend resolves the tenant
        #     from the real subdomain (no dev X-Tenant-Subdomain header needed). ---
        location /api/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /hangfire/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /hubs/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- SPA (ng serve) + its live-reload websocket. ---
        location / {
            proxy_pass http://127.0.0.1:4200;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
