# Local TLS reverse proxy for subdomain multi-tenancy — DOCKER/Linux variant.
# Runs as an nginx container on the compose network; terminates TLS for *.myhrm.org and
# routes to the backend/frontend CONTAINERS by service name:
#   /api, /hangfire, /hubs  -> backend:5000
#   everything else         -> frontend:80  (the built Angular SPA)
# Certs are mounted read-only at /etc/nginx/certs. Bring up with:
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d nginx
# (Linux counterpart of local-dev/nginx.dev.conf, which targeted host-native nginx.exe.)

worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WebSocket upgrade passthrough (SignalR hubs).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Plain HTTP -> HTTPS redirect.
    server {
        listen 80;
        server_name myhrm.org *.myhrm.org;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name myhrm.org *.myhrm.org;

        ssl_certificate     /etc/nginx/certs/myhrm.fullchain.crt;
        ssl_certificate_key /etc/nginx/certs/myhrm.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # --- API -> backend. Host is preserved so the backend resolves the tenant
        #     from the real subdomain (e2e.myhrm.org -> tenant "e2e"). ---
        location /api/ {
            proxy_pass http://backend:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /hangfire/ {
            proxy_pass http://backend:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /hubs/ {
            proxy_pass http://backend:5000;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- SPA (built Angular served by the frontend container). ---
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
