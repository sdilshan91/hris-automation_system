# Local full-stack dev environment: Postgres + Redis + .NET 10 API + Angular 20 (nginx).
# Usage:
#   cp docker.env.example docker.env   # then edit if you want stable secrets
#   docker compose up --build
# App:     http://localhost:4200
# API:     http://localhost:5000  (Swagger at /swagger, Hangfire at /hangfire)
#
# Note: the Angular bundle is built with the `development` configuration, whose apiBaseUrl is
# RELATIVE (`/api/v1`). The browser therefore calls the frontend's own origin (:4200) and nginx
# proxies /api and /hubs to the backend container — so the frontend container DOES talk to the
# backend container-to-container. (This note previously said the opposite; it predated the
# 2026-06-30 switch to a relative base URL and was corrected under queue item E4.)
# The backend port stays published for Swagger, Hangfire and direct API probing.
name: hris

services:
  postgres:
    image: postgres:17-alpine
    env_file: ./docker.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      # ISSUE-360: name the stage EXPLICITLY. Docker builds the last stage when no target is
      # given, so this file silently built `debug` (Debug config on the SDK base, 6.85 GB)
      # while `runtime` was never built at all. The Dockerfile now also keeps `runtime` last;
      # this line means a future stage appended below it cannot re-introduce the same trap.
      target: runtime
    env_file: ./docker.env
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # ISSUE-346: the app exposes /health/ready (Postgres readiness + Redis-as-Degraded) and /health/live, but
    # NOTHING consumed them — postgres and redis each had a healthcheck while the service that actually serves
    # traffic had none. So compose reported `backend` as up the moment the container process started, before
    # migrations and seeding had finished, and `frontend` (depends_on: backend) came up against an API that was
    # not yet answering. Readiness is checked here so dependents can gate on it.
    #
    # start_period covers first-boot migrations + seeding, which are slow on a fresh volume and must NOT be
    # counted as failures. curl is installed in the runtime stage of src/backend/Dockerfile specifically for
    # this probe — the stock aspnet:10.0 image has neither curl nor wget, so without that install the check
    # could never pass and `frontend` would never start.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      # ISSUE-346: wait for the API to be READY, not merely started — otherwise the SPA loads and immediately
      # fires calls at a backend still running migrations.
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ClamAV malware scanner (ISSUE-101). OPT-IN via the "scanning" profile so a normal local
  # `docker compose up` NEVER starts it (clamd needs ~1.5-2 GB RAM). Enable in staging/prod only:
  #   docker compose --profile scanning up            (starts clamd)
  #   + set VirusScanning__ClamAv__Host=clamav in docker.env  (arms the app-side gate)
  # First boot downloads the signature DB (~1-2 min) before it accepts scans; the volume persists
  # signatures across restarts. The app fail-closes (rejects uploads) while clamd is not yet healthy.
  clamav:
    image: clamav/clamav:stable
    profiles: ["scanning"]
    volumes:
      - clamavdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  clamavdb:
