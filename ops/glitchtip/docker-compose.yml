# GlitchTip — self-hosted, Sentry-API-compatible error tracking.
# Chosen (see docs/vault/decisions/ADR-2026-07-08-saas-data-governance-posture.md) so
# PII-bearing exceptions from the HRM SaaS never leave our trust boundary to a
# third-party sub-processor. Its Postgres/Redis are internal-only (no host ports) to
# avoid clashing with the app's own DB/Redis; only the web UI is exposed on :8000.
#
# All secrets + the DB DSN live in ops/glitchtip/.env (gitignored). First run:
#   1. docker compose --env-file ops/glitchtip/.env -f ops/glitchtip/docker-compose.yml up -d
#   2. open http://localhost:8000 -> register the first user (becomes superuser)
#   3. create an Organization + a Project -> copy its DSN
#   4. hand the DSN to the agent to wire the .NET + Angular SDKs (with PII scrubbing)

x-gt-env: &gt-env
  DATABASE_URL: ${GT_DATABASE_URL}
  SECRET_KEY: ${GT_SECRET_KEY}
  REDIS_URL: redis://gt-redis:6379/0
  PORT: "8000"
  GLITCHTIP_DOMAIN: http://localhost:8000
  EMAIL_URL: consolemail://
  DEFAULT_FROM_EMAIL: glitchtip@localhost
  CELERY_WORKER_AUTOSCALE: "1,3"

services:
  gt-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GT_PG_PASSWORD}
    volumes:
      - gt-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  gt-redis:
    image: redis:7-alpine
    restart: unless-stopped

  migrate:
    image: glitchtip/glitchtip:latest
    command: ./manage.py migrate
    depends_on:
      - gt-postgres
    environment: *gt-env
    restart: "no"

  web:
    image: glitchtip/glitchtip:latest
    depends_on:
      - gt-postgres
      - gt-redis
      - migrate
    ports:
      - "8000:8000"
    environment: *gt-env
    restart: unless-stopped

  worker:
    image: glitchtip/glitchtip:latest
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      - gt-postgres
      - gt-redis
    environment: *gt-env
    restart: unless-stopped

volumes:
  gt-pgdata:
